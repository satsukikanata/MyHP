/* ==========================================================================
   音ノ彼方 / 彩月かなた — Official Website (HOMEモック用スタイル)
   ========================================================================== */

/* --- 基本リセット & 変数定義 --- */
:root {
  /* 背景・環境カラー */
  --bg-deep-space: #03060f;
  --bg-night-sky: #071022;
  --bg-forest-deep: #050b16;

  /* 木々のシルエットカラー（奥・中・手前） */
  --tree-layer-back: #0e1e36;
  --tree-layer-mid: #081324;
  --tree-layer-front: #030811;

  /* 精霊・光のカラー */
  --spirit-cyan: rgba(140, 245, 225, 0.85);
  --spirit-gold: rgba(255, 240, 160, 0.85);
  --spirit-blue: rgba(170, 210, 255, 0.85);
  --moonlight-glow: rgba(160, 205, 255, 0.12);

  /* テキストカラー（視認性を確保） */
  --text-main: #f0f4fc;
  --text-sub: #b2c2de;
  --text-dim: #7384a2;

  /* ナビゲーション・UI */
  --ui-bg: rgba(10, 22, 42, 0.55);
  --ui-border: rgba(160, 205, 255, 0.2);
  --ui-hover-bg: rgba(24, 48, 86, 0.7);
  --ui-hover-border: rgba(160, 230, 220, 0.6);

  /* フォント指定（明朝体ベースで静寂と幻想的な雰囲気を演出） */
  --font-serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-sans: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;

  /* トランジション */
  --transition-normal: 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  --transition-slow: 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  background-color: var(--bg-deep-space);
  color: var(--text-main);
  font-family: var(--font-serif);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- 背景シーン（夜の森全体を包むコンテナ） --- */
.forest-scene {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* コンテンツのクリックを邪魔しない */
  overflow: hidden;
  z-index: 1;
}

/* 夜空のベースグラデーション */
.sky-layer {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 18%, #112244 0%, #071226 45%, var(--bg-deep-space) 100%);
  z-index: 1;
}

/* 月明かりのやわらかな漏れ */
.moonlight {
  position: absolute;
  top: -10%;
  left: 50%;
  transform: translateX(-50%);
  width: min(800px, 120vw);
  height: min(800px, 120vw);
  background: radial-gradient(circle, var(--moonlight-glow) 0%, rgba(140, 190, 255, 0.05) 45%, transparent 70%);
  border-radius: 50%;
  filter: blur(40px);
  z-index: 2;
  opacity: 0.8;
  animation: moonlightPulse 12s ease-in-out infinite alternate;
}

@keyframes moonlightPulse {
  0% { transform: translateX(-50%) scale(0.95); opacity: 0.7; }
  100% { transform: translateX(-50%) scale(1.05); opacity: 0.95; }
}

/* 星と精霊を描画するCanvas */
#forest-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
}

/* --- 霧レイヤー（奥行き感を出す多重レイヤー） --- */
.fog-layer {
  position: absolute;
  inset: 0;
  width: 200%;
  height: 100%;
  background-repeat: repeat-x;
  pointer-events: none;
}

/* 奥の霧 */
.fog-back {
  background: radial-gradient(ellipse 60% 30% at 50% 60%, rgba(80, 140, 180, 0.12) 0%, transparent 80%);
  filter: blur(35px);
  z-index: 4;
  animation: fogDriftBack 45s linear infinite;
}

/* 中間の霧 */
.fog-mid {
  background: radial-gradient(ellipse 70% 35% at 50% 75%, rgba(60, 120, 160, 0.15) 0%, transparent 80%);
  filter: blur(25px);
  z-index: 6;
  animation: fogDriftMid 30s linear infinite reverse;
}

/* 手前の淡い霧 */
.fog-front {
  background: radial-gradient(ellipse 80% 25% at 50% 90%, rgba(100, 170, 200, 0.09) 0%, transparent 75%);
  filter: blur(20px);
  z-index: 8;
  animation: fogDriftFront 22s linear infinite;
}

@keyframes fogDriftBack {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

@keyframes fogDriftMid {
  0% { transform: translateX(-50%); }
  100% { transform: translateX(0); }
}

@keyframes fogDriftFront {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* --- 木々のシルエット（SVG） --- */
.trees-layer {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.trees-layer svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 奥の木々 */
.trees-back {
  z-index: 5;
  opacity: 0.65;
}

/* 手前の木々（額縁のように左右と下部に配置） */
.trees-front {
  z-index: 7;
  opacity: 0.95;
}

/* 周辺減光（ビジュアルを引き締め、中央のコンテンツに自然と視線を集める） */
.vignette-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(3, 7, 15, 0.5) 80%, rgba(2, 5, 12, 0.85) 100%);
  z-index: 9;
  pointer-events: none;
}

/* --- サイトコンテンツ（テキスト・ナビゲーション） --- */
.site-wrapper {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 40px 24px 28px;
  animation: sceneFadeIn 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* ページを開いたときの静かな入場アニメーション（夜の森へ入った感覚） */
@keyframes sceneFadeIn {
  0% {
    opacity: 0;
    transform: translateY(10px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ヘッダー */
.site-header {
  width: 100%;
  max-width: 960px;
  text-align: center;
}

.site-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 999px;
  background: rgba(14, 25, 45, 0.4);
  border: 1px solid rgba(140, 185, 230, 0.15);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.badge-spark {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--spirit-cyan);
  box-shadow: 0 0 8px var(--spirit-cyan);
  animation: pulseDot 2.5s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { opacity: 0.4; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* メイン（ヒーローセクション） */
.hero-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  max-width: 820px;
  width: 100%;
  margin: 40px 0;
}

/* キャッチコピー */
.hero-catch {
  font-size: 0.95rem;
  letter-spacing: 0.35em;
  color: var(--text-sub);
  margin-bottom: 24px;
  font-weight: 300;
  text-shadow: 0 0 12px rgba(160, 205, 255, 0.3);
}

/* メインタイトル */
.hero-title {
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.title-main {
  display: block;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  font-weight: 400;
  letter-spacing: 0.28em;
  padding-left: 0.28em; /* letter-spacingの右寄りを中央補正 */
  color: #ffffff;
  text-shadow: 
    0 0 20px rgba(180, 220, 255, 0.4),
    0 0 40px rgba(120, 180, 240, 0.2);
}

.title-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 120px;
  margin: 4px 0;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(160, 210, 255, 0.3), transparent);
}

.divider-spark {
  color: var(--spirit-cyan);
  font-size: 0.8rem;
  filter: drop-shadow(0 0 6px var(--spirit-cyan));
}

.title-sub {
  display: block;
  font-size: clamp(1rem, 2.6vw, 1.4rem);
  font-weight: 300;
  letter-spacing: 0.32em;
  padding-left: 0.32em;
  color: var(--text-sub);
  text-shadow: 0 0 12px rgba(140, 190, 240, 0.25);
}

/* サイト説明文（余白を意識した静かな文章） */
.hero-desc {
  font-size: clamp(0.85rem, 1.8vw, 1rem);
  letter-spacing: 0.2em;
  color: var(--text-sub);
  line-height: 2.2;
  margin-bottom: 48px;
  max-width: 540px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

/* --- ナビゲーション（森に浮かぶ光を辿るUI） --- */
.forest-nav {
  width: 100%;
  max-width: 760px;
}

.nav-list {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px 18px;
}

.nav-item {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 22px;
  color: var(--text-main);
  text-decoration: none;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  letter-spacing: 0.18em;
  background: var(--ui-bg);
  border: 1px solid var(--ui-border);
  border-radius: 999px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  transition: all var(--transition-normal);
  cursor: pointer;
}

/* ナビゲーション左横の小さな光の粒（精霊の道標） */
.nav-spirit {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--spirit-cyan);
  box-shadow: 0 0 8px var(--spirit-cyan);
  transition: transform var(--transition-normal), box-shadow var(--transition-normal), background-color var(--transition-normal);
}

.nav-item:hover {
  background: var(--ui-hover-bg);
  border-color: var(--ui-hover-border);
  color: #ffffff;
  transform: translateY(-2px);
  box-shadow: 
    0 6px 20px rgba(0, 0, 0, 0.45),
    0 0 15px rgba(120, 220, 200, 0.25);
}

.nav-item:hover .nav-spirit {
  transform: scale(1.4);
  background: #ffffff;
  box-shadow: 0 0 12px #ffffff, 0 0 20px var(--spirit-cyan);
}

/* アクティブ項目（HOME） */
.nav-item.active {
  border-color: rgba(140, 240, 220, 0.5);
  background: rgba(18, 38, 68, 0.7);
  box-shadow: 0 0 16px rgba(100, 210, 190, 0.2);
}

.nav-item.active .nav-spirit {
  background: #bbf7e8;
  box-shadow: 0 0 10px #bbf7e8;
}

/* フォーカス時のアクセシビリティ（キーボード操作対応） */
.nav-item:focus-visible {
  outline: 2px solid var(--spirit-cyan);
  outline-offset: 3px;
}

/* --- フッター --- */
.site-footer {
  width: 100%;
  max-width: 960px;
  text-align: center;
  padding-top: 24px;
}

.footer-copy {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.mock-notice {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: rgba(140, 175, 210, 0.6);
  padding: 2px 10px;
  border-radius: 4px;
  background: rgba(10, 20, 35, 0.3);
}

/* --- レスポンシブ対応（スマートフォン・小型画面向け） --- */
@media (max-width: 768px) {
  .site-wrapper {
    padding: 28px 18px 20px;
  }

  .hero-content {
    margin: 24px 0 32px;
  }

  .hero-catch {
    font-size: 0.82rem;
    letter-spacing: 0.25em;
    margin-bottom: 16px;
  }

  .hero-desc {
    font-size: 0.85rem;
    line-height: 2;
    margin-bottom: 36px;
    padding: 0 10px;
  }

  /* スマホではPC用の改行を解除 */
  .pc-only {
    display: none;
  }

  /* スマホでのナビゲーション：押しやすい2列グリッド */
  .nav-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
  }

  .nav-item {
    justify-content: center;
    padding: 12px 14px;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    min-height: 46px; /* タップしやすいサイズ */
  }

  /* スマホでは霧のアニメーションやブラーの負荷を軽減 */
  .fog-back {
    filter: blur(20px);
    animation-duration: 60s;
  }

  .fog-mid {
    filter: blur(15px);
    animation-duration: 40s;
  }

  .fog-front {
    display: none; /* スマホでは手前の霧を省略して文字をクリアに */
  }

  .moonlight {
    filter: blur(25px);
    opacity: 0.7;
  }
}

/* --- 視覚負荷軽減（prefers-reduced-motion）対応 --- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .site-wrapper {
    opacity: 1 !important;
    transition: none !important;
  }

  .fog-layer {
    animation: none !important;
  }

  .moonlight {
    animation: none !important;
  }
}
  </style>
</head>

      <p class="mock-notice">※ 世界観・ビジュアル確認用モック</p>
    </footer>
  </div>

  <script>
/**
 * 音ノ彼方 / 彩月かなた — Official Website
 * main.js: 背景の星・浮遊する淡い光（精霊）のCanvas演出、および初期化処理
 */

(function () {
  'use strict';

  // 動作軽減設定（アニメーションを抑える設定）の確認
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // DOMContentLoaded時の初期化
  document.addEventListener('DOMContentLoaded', () => {
    initForestCanvas();
  });

  // ページ読み込み完了時にフェードイン表示を適用
  window.addEventListener('load', () => {
    // わずかな遅延を置いて自然に森が広がる感覚を演出
    setTimeout(() => {
      document.body.classList.add('is-loaded');
    }, 150);
  });

  /**
   * 背景の星空・浮遊する光（精霊）を制御するCanvas
   */
  function initForestCanvas() {
    const canvas = document.getElementById('forest-canvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let dpr = 1;
    let animationFrameId = null;

    // マウス位置（PCでの緩やかな反応用）
    const mouse = { x: -1000, y: -1000, isHovering: false };

    // 光の精霊の色定義（淡いシアン・月光ブルー・淡い金色）
    const spiritColors = [
      { r: 140, g: 245, b: 225 }, // 淡いシアン（青緑）
      { r: 170, g: 215, b: 255 }, // 月光ブルー
      { r: 255, g: 240, b: 170 }, // 淡い黄金
      { r: 190, g: 235, b: 245 }  // 透き通る白青
    ];

    let stars = [];
    let spirits = [];

    // キャンバスのリサイズ処理
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.scale(dpr, dpr);

      initElements();
    }

    // 星と精霊（浮遊する光）の生成
    function initElements() {
      const isMobile = width < 768;

      // 1. 星の生成（画面サイズに応じて数を調整）
      const starCount = isMobile ? 35 : 75;
      stars = [];
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.75), // 空から木々の上部に散りばめる
          radius: Math.random() * 1.2 + 0.4,
          baseAlpha: Math.random() * 0.6 + 0.2,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinkleAngle: Math.random() * Math.PI * 2
        });
      }

      // 2. 精霊（抽象的な光の球）の生成
      // スマホでは文字の邪魔をしないよう数を控えめに（5個）、PCは12個
      const spiritCount = isMobile ? 5 : 12;
      spirits = [];
      for (let i = 0; i < spiritCount; i++) {
        const color = spiritColors[Math.floor(Math.random() * spiritColors.length)];
        spirits.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.85 + (height * 0.1),
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.25 - 0.05, // ほんの少し上向きに漂いやすい
          radius: Math.random() * 2.5 + 2.0,       // 中心光の半径
          glowMultiplier: Math.random() * 6 + 7,   // 光彩の広がり倍率
          color: color,
          alpha: Math.random() * 0.4 + 0.4,
          pulseSpeed: Math.random() * 0.015 + 0.008,
          pulseAngle: Math.random() * Math.PI * 2,
          wanderAngle: Math.random() * Math.PI * 2,
          wanderSpeed: Math.random() * 0.01 + 0.005
        });
      }
    }

    // 星の描画と更新
    function drawStars() {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        if (!prefersReducedMotion) {
          s.twinkleAngle += s.twinkleSpeed;
        }
        const currentAlpha = Math.max(0.1, s.baseAlpha + Math.sin(s.twinkleAngle) * 0.3);

        ctx.fillStyle = `rgba(225, 240, 255, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 精霊（淡い光）の描画と更新
    function drawSpirits() {
      for (let i = 0; i < spirits.length; i++) {
        const sp = spirits[i];

        if (!prefersReducedMotion) {
          // ふわふわとたゆたう自然な揺らぎ（ランダムな風の影響）
          sp.wanderAngle += (Math.random() - 0.5) * 0.1;
          sp.vx += Math.cos(sp.wanderAngle) * 0.015;
          sp.vy += Math.sin(sp.wanderAngle) * 0.015;

          // 速度制限（速くなりすぎないように制御）
          const maxSpeed = 0.45;
          const speed = Math.sqrt(sp.vx * sp.vx + sp.vy * sp.vy);
          if (speed > maxSpeed) {
            sp.vx = (sp.vx / speed) * maxSpeed;
            sp.vy = (sp.vy / speed) * maxSpeed;
          }

          // マウスカーソルに対する穏やかな反応（近づくと少しだけ道を譲るように避ける）
          if (mouse.isHovering) {
            const dx = sp.x - mouse.x;
            const dy = sp.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const avoidDist = 120;
            if (dist < avoidDist && dist > 0) {
              const force = (avoidDist - dist) / avoidDist;
              sp.vx += (dx / dist) * force * 0.15;
              sp.vy += (dy / dist) * force * 0.15;
            }
          }

          sp.x += sp.vx;
          sp.y += sp.vy;

          // 画面端を越えたときのゆるやかなループ
          const padding = 60;
          if (sp.x < -padding) sp.x = width + padding;
          if (sp.x > width + padding) sp.x = -padding;
          if (sp.y < -padding) sp.y = height + padding;
          if (sp.y > height + padding) sp.y = -padding;

          // 呼吸するような明滅
          sp.pulseAngle += sp.pulseSpeed;
        }

        const currentAlpha = Math.max(0.15, sp.alpha + Math.sin(sp.pulseAngle) * 0.25);
        const glowRadius = sp.radius * sp.glowMultiplier;

        // 外側のやわらかな光彩（グラデーション）
        const glow = ctx.createRadialGradient(
          sp.x, sp.y, 0,
          sp.x, sp.y, glowRadius
        );
        const { r, g, b } = sp.color;
        glow.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${currentAlpha})`);
        glow.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${currentAlpha * 0.5})`);
        glow.addColorStop(0.7, `rgba(${r}, ${g}, ${b}, ${currentAlpha * 0.12})`);
        glow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        // 中心の明るい光核
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, currentAlpha + 0.2)})`;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // アニメーションループ
    function render() {
      ctx.clearRect(0, 0, width, height);

      drawStars();
      drawSpirits();

      if (!prefersReducedMotion) {
        animationFrameId = requestAnimationFrame(render);
      }
    }

    // イベントリスナー設定
    window.addEventListener('resize', resize);

    // PCでのマウスホバー検知
    if (window.innerWidth >= 768) {
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.isHovering = true;
      });

      window.addEventListener('mouseleave', () => {
        mouse.isHovering = false;
        mouse.x = -1000;
        mouse.y = -1000;
      });
    }

    // 初期起動
    resize();
    render();
  }
})();
  </script>
</body>
</html>
